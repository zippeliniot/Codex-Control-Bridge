# Codex Control Bridge - Result-Schema
# BRIDGE-003 . Konzept-Abschnitt 6
#
# Formaler, maschinenprüfbarer Vertrag für ein Ergebnis ("bridge_result").
# Gegenstück zum Task-Schema. JSON Schema (Draft 2020-12) in YAML-Form.
#
#   additionalProperties: false  -> unbekannte/vertippte Felder werden fail-closed abgelehnt.
#
# Ein Ergebnis ist eindeutig einem Auftrag UND einem Lauf zugeordnet
# (bridge_task_id + run_id) und trägt den Git- und Ausführungszustand als Provenienz.
#
# Abgrenzung (bewusst NICHT hier):
#   - Zustandsübergänge            -> BRIDGE-004
#   - Auftragsvertrag              -> Task-Schema (BRIDGE-002)
#   - Validierung / Ablage / Audit -> BRIDGE-004 / BRIDGE-005

$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://github.com/zippeliniot/Codex-Control-Bridge/schemas/result.schema.yaml"
title: "Codex Control Bridge Result"
description: "Ergebnisvertrag eines Auftragslaufs zwischen Ausführungsinstanz und Steuerprozess."
type: object
additionalProperties: false

# Pflichtfelder eines gültigen Ergebnisses
required:
  - schema_version
  - kind
  - bridge_task_id
  - project_id
  - run_id
  - status
  - repository
  - branch
  - head
  - executor
  - started_at
  - ended_at
  - created_by

# Fail-closed-Bedingung: Ein unterbrochener Lauf MUSS Ursache und Resume-Fähigkeit nennen.
allOf:
  - if:
      properties:
        status:
          const: INTERRUPTED
      required: [status]
    then:
      required: [interruption_reason, resumable]

properties:

  # ---------- Meta ----------
  schema_version:
    description: "Version dieses Schemas."
    type: string
    pattern: "^[0-9]+\\.[0-9]+$"

  kind:
    description: "Fester Diskriminator. Schützt fail-closed vor Fehlinterpretation fremder Dateien."
    const: "bridge_result"

  # ---------- Verknüpfung zum Auftrag ----------
  bridge_task_id:
    description: "Auftrag, zu dem dieses Ergebnis gehört."
    type: string
    pattern: "^BRIDGE-[0-9]{3,}$"

  project_id:
    description: "Projektkennung (muss zum Auftrag passen)."
    type: string
    minLength: 1

  project_task_id:
    description: "Externe Projekt-ID (z. B. DORF-008) oder null."
    type: ["string", "null"]
    default: null

  # ---------- Lauf ----------
  run_id:
    description: "Fortlaufende Lauf-ID desselben Auftrags (RUN-01, RUN-02, ...)."
    type: string
    pattern: "^RUN-[0-9]{2,}$"

  started_at:
    description: "Startzeitpunkt des Laufs (ISO 8601 / RFC 3339)."
    type: string
    format: date-time

  ended_at:
    description: "Endzeitpunkt des Laufs (auch bei Abbruch/Unterbrechung)."
    type: string
    format: date-time

  # ---------- Ergebnis / Ausgang ----------
  status:
    description: "Ausgang des Laufs. COMPLETED = Ergebnisvertrag erfüllt, NICHT fachlich freigegeben."
    type: string
    enum: [COMPLETED, FAILED, BLOCKED, INTERRUPTED, REVIEW_REQUIRED, APPROVAL_REQUIRED]

  summary:
    description: "Kurzbeschreibung, was der Lauf getan hat."
    type: ["string", "null"]
    default: null

  acceptance_results:
    description: "Abgleich gegen die acceptance_criteria des Auftrags."
    type: array
    default: []
    items:
      type: object
      additionalProperties: false
      required: [criterion, met]
      properties:
        criterion:
          type: string
          minLength: 1
        met:
          type: boolean
        note:
          type: ["string", "null"]
          default: null

  # ---------- Unterbrechung / Resume ----------
  interruption_reason:
    description: "Ursache bei status=INTERRUPTED, sonst null."
    type: ["string", "null"]
    enum: [TECHNICAL_ERROR, TOOLCHAIN_ERROR, USER_ABORT, USAGE_LIMIT, MACHINE_SHUTDOWN, NETWORK_INTERRUPTION, PROCESS_ABORT, null]
    default: null

  resumable:
    description: "Kann der Lauf fortgesetzt werden?"
    type: ["boolean", "null"]
    default: null

  resume_hint:
    description: "Optionaler Hinweis, wo/wie fortzusetzen ist."
    type: ["string", "null"]
    default: null

  # ---------- Git-Provenienz ----------
  repository:
    description: "Repository des Laufs."
    type: string
    minLength: 1

  branch:
    description: "Arbeitsbranch des Laufs."
    type: string
    minLength: 1

  base_head:
    description: "HEAD-Commit (SHA) zu Beginn des Laufs, oder null."
    type: ["string", "null"]
    default: null

  head:
    description: "HEAD-Commit (SHA) am Ende des Laufs."
    type: string
    minLength: 1

  pushed:
    description: "Wurde der Stand nach origin gepusht?"
    type: boolean
    default: false

  commits:
    description: "Im Lauf erzeugte Commits."
    type: array
    default: []
    items:
      type: object
      additionalProperties: false
      required: [sha]
      properties:
        sha:
          type: string
          minLength: 1
        message:
          type: ["string", "null"]
          default: null

  changed_files:
    description: "Im Lauf geänderte Dateien/Pfade."
    type: array
    default: []
    items:
      type: string

  # ---------- Integrität (Hashes) ----------
  task_hash:
    description: "Optionaler Hash der zugrunde liegenden Task-Datei."
    type: ["string", "null"]
    default: null

  result_hash:
    description: "Optionaler Hash dieses Ergebnisses."
    type: ["string", "null"]
    default: null

  diff_hash:
    description: "Optionaler Hash des erzeugten Diffs."
    type: ["string", "null"]
    default: null

  # ---------- Ausführungs-Provenienz ----------
  executor:
    description: "Ausführende Instanz, z. B. claude-code oder codex."
    type: string
    minLength: 1

  physical_machine:
    description: "Physische Maschine (z. B. HAM11, DES11) oder null."
    type: ["string", "null"]
    default: null

  environment:
    description: "Logische Umgebung (z. B. HAM01, DES01) oder null."
    type: ["string", "null"]
    default: null

  runtime:
    description: "Laufzeitumgebung (z. B. windows, wsl) oder null."
    type: ["string", "null"]
    default: null

  model:
    description: "Verwendetes Executor-Modell oder null."
    type: ["string", "null"]
    default: null

  reasoning_level:
    description: "Verwendete Denkstufe."
    type: ["string", "null"]
    enum: [LOW, MEDIUM, HIGH, null]
    default: null

  # ---------- Provenienz ----------
  created_by:
    description: "Erzeugende Instanz/Akteur des Ergebnisses."
    type: string
    minLength: 1
