# Codex Control Bridge - Projektprofil-Schema
# BRIDGE-010 . Konzept-Abschnitt 11/12
#
# Projektspezifische Regeln leben im Profil, NICHT im Core.
# Ein Profil je Projekt unter projects/<id>/project.yaml.
# JSON Schema (Draft 2020-12) in YAML-Form, additionalProperties: false (fail-closed).

$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://github.com/zippeliniot/Codex-Control-Bridge/schemas/project.schema.yaml"
title: "Codex Control Bridge Project Profile"
description: "Projektspezifische Regeln (Adapter) außerhalb des projektunabhängigen Core."
type: object
additionalProperties: false

required:
  - schema_version
  - kind
  - project_id
  - repository
  - default_branch
  - task_prefix
  - read_only

properties:
  schema_version:
    type: string
    pattern: "^[0-9]+\\.[0-9]+$"
  kind:
    const: "bridge_project_profile"
  project_id:
    description: "Eindeutige Projektkennung (= Verzeichnisname unter projects/)."
    type: string
    minLength: 1
  description:
    type: ["string", "null"]
    default: null
  repository:
    type: string
    minLength: 1
  default_branch:
    type: string
    minLength: 1
  task_prefix:
    description: "Externer Nummernraum, z. B. BRIDGE oder DORF. Strikt getrennt.
      Max. 8 Grossbuchstaben (BRIDGE-015: passend zu bridge_task_id-Format
      <PREFIX>-<4 Ziffern>)."
    type: string
    pattern: "^[A-Z]{1,8}$"
  read_only:
    description: "Pflicht. true = die Bridge darf dieses Projekt nur lesen."
    type: boolean
  worktree_root:
    type: ["string", "null"]
    default: null
  allowed_machines:
    description: "Physische Maschinen, auf denen dieses Projekt bearbeitet werden darf."
    type: array
    items:
      type: string
    default: []
  model_policy:
    type: ["object", "null"]
    additionalProperties: false
    default: null
    properties:
      default_model:
        type: ["string", "null"]
      default_reasoning_level:
        type: ["string", "null"]
        enum: [LOW, MEDIUM, HIGH, null]
  git_policy:
    type: ["object", "null"]
    additionalProperties: false
    default: null
    properties:
      allow_push:        { type: boolean }
      allow_merge:       { type: boolean }
      allow_force_push:  { type: boolean }
      protected_branches:
        type: array
        items: { type: string }
  test_policy:
    type: ["object", "null"]
    additionalProperties: false
    default: null
    properties:
      command:  { type: ["string", "null"] }
      required: { type: boolean }
  handover_policy:
    type: ["object", "null"]
    additionalProperties: false
    default: null
    properties:
      branch:        { type: string }
      require_clean: { type: boolean }
  executor:
    description: "Ausführende Instanz für dieses Projekt (CLI-getrieben). null = nicht automatisiert."
    type: ["string", "null"]
    enum: [codex, claude-code, null]
    default: null
  controller:
    description: "Steuerinstanz (ersetzt den Browser-Chat). human = manuell; sonst API-gesteuert."
    type: ["string", "null"]
    enum: [anthropic, openai, human, null]
    default: null
  review_roles:
    description: >-
      Fachliche Führungs-/Pruefrolle (Kontrollzweck), getrennt von
      executor/controller (die regeln nur die technische Ausfuehrung/
      Steuerung, nicht die fachliche Verantwortung). Projekt-Default;
      kann pro Auftrag ueberschrieben werden (siehe task.schema.yaml).
    type: ["object", "null"]
    additionalProperties: false
    default: null
    properties:
      lead:
        description: "Fachlich fuehrende KI fuer dieses Projekt."
        type: ["string", "null"]
        enum: [anthropic, openai, human, null]
      support:
        description: "Unterstuetzende/pruefende KI (Cross-Check, keine Alleinverantwortung)."
        type: ["string", "null"]
        enum: [anthropic, openai, human, null]
  github_repo:
    description: >-
      Vollqualifizierter GitHub-Slug ("Besitzer/Repo") fuer Steuerprozesse
      ohne lokalen Checkout (z. B. ChatGPT ueber GitHub-Connector/-API).
      Getrennt vom Feld 'repository', das nur der lokale Verzeichnisname
      ist (siehe registry.py: <basis>/<repository>). Null = kein
      dokumentierter Remote-Zugriff ohne lokalen Checkout vorgesehen.
    type: ["string", "null"]
    pattern: "^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$"
    default: null
  migration_policy:
    type: ["object", "null"]
    additionalProperties: false
    default: null
    properties:
      allow_production: { type: boolean }
  orchestrator_policy:
    description: >-
      Projektspezifische Grenze fuer automatisches Ausloesen durch einen
      kuenftigen Orchestrator-Prozess (BRIDGE-0031). Alles ausserhalb von
      auto_trigger_permissions bleibt Vorschlag/Mensch-Aktion.
    type: ["object", "null"]
    additionalProperties: false
    default: null
    properties:
      auto_trigger_permissions:
        description: >-
          Permission-Typen, die fuer dieses Projekt automatisch ausgeloest
          werden duerfen. FORCE_PUSH ist hier bewusst nicht im Enum (siehe
          BRIDGE-024 Sicherheitsentscheid, keine Ausnahme moeglich).
        type: array
        items:
          type: string
          enum: [READ_ONLY, WORKTREE_WRITE, TEST_EXECUTION, GIT_STAGE,
                 GIT_COMMIT, GIT_PUSH, PR_CREATE, MERGE, DEPLOY,
                 DATABASE_WRITE]
        default: [READ_ONLY, WORKTREE_WRITE, TEST_EXECUTION]
