# Codex Control Bridge - Task-Schema
# BRIDGE-002 . Konzept-Abschnitt 5
#
# Formaler, maschinenprüfbarer Vertrag für einen Auftrag ("bridge_task").
# Geschrieben als JSON Schema (Draft 2020-12) in YAML-Form mit Kommentaren:
# streng in der Semantik, lesbar in der Form.
#
#   additionalProperties: false  -> unbekannte/vertippte Felder werden fail-closed abgelehnt.
#
# Abgrenzung (bewusst NICHT hier):
#   - Zustandsübergänge          -> BRIDGE-004
#   - Läufe / Resume / Ergebnis  -> Result-Schema (BRIDGE-003)
#   - Validierung / Ablage / CLI -> BRIDGE-005 / BRIDGE-006

$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://github.com/zippeliniot/Codex-Control-Bridge/schemas/task.schema.yaml"
title: "Codex Control Bridge Task"
description: "Unveränderlicher Auftragsvertrag zwischen Steuerprozess und Ausführungsinstanz."
type: object
additionalProperties: false

# Pflichtfelder eines gültigen Auftrags
required:
  - schema_version
  - kind
  - bridge_task_id
  - project_id
  - title
  - description
  - task_class
  - repository
  - branch
  - permissions
  - status
  - created_at
  - created_by

properties:

  # ---------- Meta ----------
  schema_version:
    description: "Version dieses Schemas, für sichere Weiterentwicklung."
    type: string
    pattern: "^[0-9]+\\.[0-9]+$"          # z. B. "1.0"

  kind:
    description: "Fester Diskriminator. Schützt fail-closed vor Fehlinterpretation fremder Dateien."
    const: "bridge_task"

  # ---------- Identität (unveränderlich) ----------
  bridge_task_id:
    description: "Systemweit eindeutige Bridge-ID."
    type: string
    pattern: "^[A-Z]{1,8}-[0-9]{4}$"      # BRIDGE-0001, DORF-0042, ... (BRIDGE-015)

  project_id:
    description: "Projektkennung, z. B. codex-control-bridge oder dorfschaft."
    type: string
    minLength: 1

  project_task_id:
    description: "Externe Projekt-ID (z. B. DORF-008). Null bei reinen Bridge-Aufträgen."
    type: ["string", "null"]
    default: null

  # ---------- Beschreibung ----------
  title:
    description: "Einzeiler."
    type: string
    minLength: 1

  description:
    description: "Was zu tun ist."
    type: string
    minLength: 1

  task_class:
    description: "Auftragsart."
    type: string
    enum: [INIT, ARCHITECTURE, FEATURE, BUGFIX, REFACTOR, TEST, DOCS, INTEGRATION, READONLY_CHECK, CHORE]

  acceptance_criteria:
    description: "Definition of Done. Speist später den Ergebnisvertrag (Result-Schema)."
    type: array
    items:
      type: string
    default: []

  # ---------- Ziel / Kontext ----------
  repository:
    description: "Ziel-Repository."
    type: string
    minLength: 1

  branch:
    description: "Erwarteter Arbeitsbranch."
    type: string
    minLength: 1

  git:
    description: "Optionale fail-closed-Absicherung des erwarteten Git-Ausgangszustands."
    type: object
    additionalProperties: false
    properties:
      expected_head:
        description: "Erwarteter HEAD-Commit (SHA) vor Ausführung."
        type: string
      allowed_changed_files:
        description: "Whitelist der Dateien/Globs, die geändert werden dürfen."
        type: array
        items:
          type: string
      expected_diff_hash:
        description: "Optionaler Hash des erwarteten Diffs zur Ergebnisprüfung."
        type: string

  # ---------- Rechte (least privilege) ----------
  permissions:
    description: >-
      Explizite Rechteliste. Standard [READ_ONLY].
      Kritische Aktionen (MERGE, DEPLOY, DATABASE_WRITE, FORCE_PUSH) nur, wenn ausdrücklich gelistet.
    type: array
    minItems: 1
    uniqueItems: true
    items:
      type: string
      enum: [READ_ONLY, WORKTREE_WRITE, TEST_EXECUTION, GIT_STAGE, GIT_COMMIT, GIT_PUSH, PR_CREATE, MERGE, DEPLOY, DATABASE_WRITE, FORCE_PUSH]
    default: [READ_ONLY]

  # ---------- Ausführung ----------
  target_environment:
    description: "Erlaubte logische Umgebung (z. B. HAM01, DES01). Null = beliebig erlaubt."
    type: ["string", "null"]
    default: null

  model:
    description: "Executor-Modell (optionaler Auftragsparameter, keine Bridge-Entscheidung)."
    type: ["string", "null"]
    default: null

  priority:
    description: >-
      Auftragspriorität. LOW/MEDIUM/HIGH (kein null — jeder Auftrag hat eine
      Priorität; Standard MEDIUM greift, wenn das Feld fehlt). Rückwärts-
      kompatibel: bestehende task.yaml-Dokumente ohne das Feld sind weiterhin
      gültig (Default MEDIUM). Setzbar über 'bridge task set-priority'
      (BRIDGE-0028), manuell über das Web-GUI.
    type: string
    enum: [LOW, MEDIUM, HIGH]
    default: MEDIUM

  reasoning_level:
    description: "Denkstufe."
    type: ["string", "null"]
    enum: [LOW, MEDIUM, HIGH, null]
    default: null

  executor:
    description: >-
      Auftragsspezifischer Override der Ausfuehrungsinstanz. Null = vom
      Projektprofil erben (project.schema.yaml: executor).
    type: ["string", "null"]
    enum: [codex, claude-code, null]
    default: null

  controller:
    description: >-
      Auftragsspezifischer Override der Steuerinstanz. Null = vom
      Projektprofil erben (project.schema.yaml: controller).
    type: ["string", "null"]
    enum: [anthropic, openai, human, null]
    default: null

  review_roles:
    description: >-
      Auftragsspezifischer Override der Fuehrungs-/Pruefrolle. Null = vom
      Projektprofil erben (project.schema.yaml: review_roles). Bei
      Nicht-Null vollstaendig (lead + support), kein Teil-Override.
    type: ["object", "null"]
    additionalProperties: false
    default: null
    properties:
      lead:
        type: ["string", "null"]
        enum: [anthropic, openai, human, null]
      support:
        type: ["string", "null"]
        enum: [anthropic, openai, human, null]

  # ---------- Status / Provenienz ----------
  status:
    description: "Aktueller Status. Standard CREATED. Übergänge: BRIDGE-004."
    type: string
    enum: [CREATED, READY, WAITING_FOR_HANDOFF_TO_EXECUTOR, CLAIMED, RUNNING, INTERRUPTED, WAITING_FOR_RESUME, COMPLETED, WAITING_FOR_COPY_TO_CONTROL, FAILED, BLOCKED, REVIEW_REQUIRED, APPROVAL_REQUIRED, ARCHIVED]
    default: CREATED

  created_at:
    description: "Erstellzeitpunkt (ISO 8601 / RFC 3339)."
    type: string
    format: date-time

  created_by:
    description: "Erzeugender Steuerprozess/Akteur."
    type: string
    minLength: 1

  depends_on:
    description: "Optionale Abhängigkeiten (Reihenfolge) als Liste von bridge_task_id."
    type: array
    items:
      type: string
      pattern: "^[A-Z]{1,8}-[0-9]{4}$"
    default: []
