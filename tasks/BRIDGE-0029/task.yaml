acceptance_criteria:
- git_commit() erkennt Non-Fast-Forward-Push-Fehler anhand von stderr/stdout-Mustern
  (rejected, non-fast-forward, fetch first), andere Fehlertypen loesen keinen Retry
  aus
- Bei erkanntem Non-Fast-Forward - git fetch + git rebase origin/<branch>, danach
  genau ein weiterer Push-Versuch
- Rebase-Konflikt - git rebase --abort, fail-closed, Commit bleibt lokal, Repo danach
  in sauberem (nicht haengendem) Zustand
- Kein Force-Push an keiner Stelle (bestehender NoForcePushTests bleibt gruen)
- Maximal ein Retry-Versuch - scheitert der zweite Push ebenfalls, kein dritter Versuch
- Neues Rueckgabefeld retried (bool), rueckwaertskompatibel, bestehende Felder unveraendert
- Test mit echtem divergiertem bare-Repo - Retry erfolgreich, beide Commits (fremd
  + eigen) im Remote-Verlauf
- Test mit echtem Rebase-Konflikt - fail-closed, sauberer Zustand danach
- Bestehender Non-Retry-Fehlerfall (test_push_failure_commit_stays_local) weiterhin
  unveraendert gruen
- SECURITY-MODEL.md Abschnitt 5c und CCB-STEUERCHAT-REFERENZ.md Teil 4 aktualisiert
- Bestehende Tests weiterhin gruen, neue Tests gruen, frischer Klon verifiziert
- Jeder Commit sofort gepusht, nicht gesammelt
