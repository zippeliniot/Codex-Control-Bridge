title: Git-Push-Retry (pull --rebase) fuer den geteilten Store
description: 'Erweitert git_commit() in src/bridge/gitops.py um einen automatischen
  Ausgleichsversuch bei Non-Fast-Forward-Push-Fehlern (mehrere Projekte/Maschinen
  teilen sich denselben Store, insbesondere audit/audit.jsonl). Non-Fast-Forward wird
  anhand von stderr/stdout-Mustern erkannt (rejected, non-fast-forward, fetch first)
  - andere Fehlertypen (kein Remote, Auth, falscher Branch) loesen KEINEN Retry aus.
  Bei erkanntem Non-Fast-Forward: git fetch + git rebase origin/<branch>, danach genau
  EIN weiterer Push-Versuch (kein Backoff, keine Schleife). Schlaegt der Rebase selbst
  fehl (Konflikt): sofort git rebase --abort, fail-closed, Commit bleibt lokal, Repo
  danach in sauberem Zustand (kein haengender Rebase). --force/--force-with-lease
  bleiben an keiner Stelle im Modul vorhanden (bestehender NoForcePushTests-Test bleibt
  gruen). Neues optionales Rueckgabefeld "retried" (bool) in git_commit(), rueckwaertskompatibel,
  bestehende Felder (committed, commit, pushed, error) unveraendert. Betrifft nur
  den push=True-Pfad (Web-UI, gitops.py wird von webui.py mit push=True immer aufgerufen);
  der CLI-Pfad (cli.py, push=False, pusht nie automatisch) bleibt unveraendert - dort
  gibt es keinen Push-Versuch, also auch nichts zu wiederholen. Tests mit echtem lokalem
  bare-Repo (Muster aus tests/test_webui.py, WebUiGitActionTests, wiederverwenden
  statt neu bauen): divergiertes Repo mit erfolgreichem Retry, sowie echter Rebase-Konflikt
  mit fail-closed-Verhalten. docs/security/SECURITY-MODEL.md Abschnitt 5c und docs/CCB-STEUERCHAT-REFERENZ.md
  Teil 4 um das Retry-Verhalten ergaenzen. Details in work-packages/BRIDGE-029.md.'
