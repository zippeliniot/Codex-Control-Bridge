description: 'Behebt zwei unabhaengig identifizierte Root-Causes aus BRIDGE-023/024:
  (1) changed_files in result.yaml war unvollstaendig, weil importer.collect_git_info
  bei fehlendem --base-head still auf "nur letzter Commit" zurueckfaellt statt fail-closed
  zu sein - base_head soll bei fehlendem Flag automatisch aus task.yaml.git.expected_head
  abgeleitet werden. (2) task.yaml fehlte in einem manuellen git-add-Commit von Claude
  Code - die in BRIDGE-024 gebaute Whitelist-Commit-Logik (_git_commit_and_push aus
  webui.py) wird nach src/bridge/gitops.py extrahiert und ueber ein neues --commit-Flag
  auch von der CLI genutzt (lokal, kein automatischer Push, Push bleibt Menschensache
  laut CLAUDE.md Regel 4). Details, Kontext und Umsetzungsschritte in work-packages/BRIDGE-025.md.'
