description: 'Neues, optionales Projektfeld orchestrator_policy in schemas/project.schema.yaml
  (analog review_roles: Objekt, additionalProperties false, default null -> globaler
  Standard). Enthaelt auto_trigger_permissions (Liste erlaubter Permission-Typen,
  die ein kuenftiger Orchestrator-Prozess fuer dieses Projekt automatisch ausloesen
  darf, ohne Menschenbestaetigung; Standard [READ_ONLY, WORKTREE_WRITE, TEST_EXECUTION]).
  FORCE_PUSH ist aus dem Enum dieses Feldes kategorisch ausgeschlossen (bestehende,
  nicht verhandelbare Sicherheitsleitplanke aus BRIDGE-024, keine Ausnahme ueber Projektkonfiguration
  moeglich). Alle anderen kritischen Aktionen (GIT_PUSH, MERGE, DEPLOY, DATABASE_WRITE,
  PR_CREATE) bleiben im Enum wählbar, damit ein Projekt sie bewusst freigeben KANN
  - Standard bleibt konservativ (nur die drei ungefaehrlichen). Zusaetzlich: docs/CCB-ORCHESTRATOR-KONZEPT.md
  um die in diesem Steuerchat getroffenen Entscheidungen zu allen drei offenen Fragen
  ergaenzen (Frage 1: projektabhaengige Grenze, Frage 2: manuelle Prioritaets-Zuweisung
  im Web-GUI mit eigenem CLI-Befehl, Frage 3: Web-UI als zentrale Mehrmaschinen-/Mehrprojekt-Steuerung,
  Git-Push-Retry-Konzept fuer die gemeinsame audit.jsonl, Review-Unternummern-Schema
  fuer Support-KI-Auftraege) sowie die geplante Umsetzungsreihenfolge BRIDGE-0027
  bis BRIDGE-0031 als Roadmap festhalten. Ausdruecklich NICHT Teil dieses Auftrags:
  die eigentliche Orchestrator-Ausloeselogik, der Prioritaets-Befehl, der Push-Retry-Mechanismus,
  das Review-Unternummern-Pattern selbst - das sind eigene, spaetere Auftraege (BRIDGE-0028
  bis BRIDGE-0031), damit die Ein-Auftrag-zur-Zeit-Disziplin eingehalten wird. Details
  in work-packages/BRIDGE-027.md.'
