summary: git_commit() in gitops.py erkennt Non-Fast-Forward-Push-Fehler (rejected/non-fast-forward/fetch
  first in stderr) und macht genau einen Ausgleichsversuch (git fetch + git rebase
  origin/main, dann erneuter Push). Rebase-Konflikt ist fail-closed (rebase --abort,
  Commit bleibt lokal, kein Force-Push). Andere Fehlertypen (kein Remote, Auth) loesen
  weiterhin keinen Retry aus. Neues optionales Rueckgabefeld 'retried' in git_commit(),
  rueckwaertskompatibel. Betrifft nur den push=True-Pfad (Web-UI); CLI-Pfad (push=False)
  unveraendert.
