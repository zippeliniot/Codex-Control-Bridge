# BEISPIEL/Vorlage für ein Projektprofil (Dorfschaft, read-only).
# Der echte, operative Dorfschaft-Adapter folgt in BRIDGE-011.
schema_version: "1.0"
kind: bridge_project_profile
project_id: dorfschaft
description: Referenzprojekt Dorfschaft - erste Integration ausschließlich lesend.
repository: Dorfschaft
default_branch: main
task_prefix: DORF
read_only: true
allowed_machines: [HAM11, DES11]
git_policy:
  allow_push: false
  allow_merge: false
  allow_force_push: false
  protected_branches: [main]
test_policy:
  command: null
  required: false
handover_policy:
  branch: main
  require_clean: true
migration_policy:
  allow_production: false
